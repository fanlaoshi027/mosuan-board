name: Patch geometry vertex editing

on:
  push:
    branches: [xournal-drawboard-ui]
    paths:
      - '.github/workflows/patch-vertex-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xournal-drawboard-ui
          fetch-depth: 0

      - name: Patch vertex editing
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          # Point is used by the new public vertex-edit undo API.
          p = root / 'src/core/control/tools/EditSelectionContents.h'
          s = p.read_text()
          if '#include "model/Point.h"' not in s:
              s = s.replace('#include "model/PageRef.h"                   // for PageRef\n',
                            '#include "model/PageRef.h"                   // for PageRef\n#include "model/Point.h"                     // for Point\n')
              p.write_text(s)

          # Keep the custom vertex undo implementation local to the existing selection model.
          p = root / 'src/core/control/tools/EditSelectionContents.cpp'
          s = p.read_text()
          if 'class VertexEditUndoAction' not in s:
              marker = 'using xoj::util::Rectangle;\n'
              insert = r'''

class VertexEditUndoAction: public UndoAction {
public:
    VertexEditUndoAction(const PageRef& page, Stroke* stroke, std::vector<Point> oldPoints,
                         std::vector<Point> newPoints):
            UndoAction("VertexEditUndoAction"), stroke(stroke), oldPoints(std::move(oldPoints)), newPoints(std::move(newPoints)) {
        this->page = page;
    }

    bool undo(Control* control) override {
        return apply(control, oldPoints);
    }

    bool redo(Control* control) override {
        return apply(control, newPoints);
    }

    std::string getText() override {
        return _("Edit geometry");
    }

private:
    bool apply(Control* control, const std::vector<Point>& points) {
        if (stroke == nullptr) {
            return false;
        }
        auto* doc = control->getDocument();
        doc->lock();
        stroke->setPointVector(points);
        doc->unlock();
        this->page->fireRectChanged(Rectangle<double>(stroke->boundingRect()));
        return true;
    }

    Stroke* stroke;
    std::vector<Point> oldPoints;
    std::vector<Point> newPoints;
};
'''
              assert marker in s
              s = s.replace(marker, marker + insert, 1)

          method_marker = 'void EditSelectionContents::updateContent(Rectangle<double> bounds, Rectangle<double> snappedBounds, double rotation,\n'
          if 'UndoActionPtr EditSelectionContents::createVertexEditUndo' not in s:
              method = r'''UndoActionPtr EditSelectionContents::createVertexEditUndo(Stroke* stroke, std::vector<Point> oldPoints) {
    if (stroke == nullptr || oldPoints.size() != stroke->getPointCount() || oldPoints.empty()) {
        return nullptr;
    }

    const auto& newPoints = stroke->getPointVector();
    bool changed = false;
    for (size_t i = 0; i < oldPoints.size(); ++i) {
        if (oldPoints[i].x != newPoints[i].x || oldPoints[i].y != newPoints[i].y || oldPoints[i].z != newPoints[i].z) {
            changed = true;
            break;
        }
    }
    if (!changed) {
        return nullptr;
    }

    return std::make_unique<VertexEditUndoAction>(this->sourcePage, stroke, std::move(oldPoints), newPoints);
}

'''
              assert method_marker in s
              s = s.replace(method_marker, method + method_marker, 1)
          p.write_text(s)

          # Add independent vertex-edit state and interaction to EditSelection.
          p = root / 'src/core/control/tools/EditSelection.cpp'
          s = p.read_text()

          mouseup_old = '''void EditSelection::mouseUp() {
    if (this->mouseDownType == CURSOR_SELECTION_DELETE) {
'''
          mouseup_new = '''void EditSelection::mouseUp() {
    if (this->mouseDownType == CURSOR_SELECTION_VERTEX) {
        if (this->vertexStroke != nullptr && !this->vertexOriginalPoints.empty()) {
            if (auto action = this->contents->createVertexEditUndo(this->vertexStroke, std::move(this->vertexOriginalPoints))) {
                this->undo->addUndoAction(std::move(action));
            }
        }
        this->vertexStroke = nullptr;
        this->vertexIndex = -1;
        this->mouseDownType = CURSOR_SELECTION_NONE;
        this->view->getXournal()->repaintSelection(true);
        return;
    }

    if (this->mouseDownType == CURSOR_SELECTION_DELETE) {
'''
          assert mouseup_old in s
          s = s.replace(mouseup_old, mouseup_new, 1)

          mousedown_old = '''    this->mouseDownType = type;

    // coordinates relative to top left corner of snapped bounds in coordinate system which is not modified
'''
          mousedown_new = '''    this->mouseDownType = type;

    if (type == CURSOR_SELECTION_VERTEX) {
        if (this->vertexStroke != nullptr && this->vertexIndex >= 0 &&
            static_cast<size_t>(this->vertexIndex) < this->vertexStroke->getPointCount()) {
            this->vertexOriginalPoints = this->vertexStroke->getPointVector();
        } else {
            this->mouseDownType = CURSOR_SELECTION_NONE;
        }
    }

    // coordinates relative to top left corner of snapped bounds in coordinate system which is not modified
'''
          assert mousedown_old in s
          s = s.replace(mousedown_old, mousedown_new, 1)

          mousemove_old = '''    if (this->mouseDownType == CURSOR_SELECTION_MOVE) {
'''
          mousemove_new = '''    if (this->mouseDownType == CURSOR_SELECTION_VERTEX) {
        if (this->vertexStroke != nullptr && this->vertexIndex >= 0 &&
            static_cast<size_t>(this->vertexIndex) < this->vertexStroke->getPointCount()) {
            cairo_matrix_t inv = this->cmatrix;
            cairo_matrix_invert(&inv);
            double px = mouseX;
            double py = mouseY;
            cairo_matrix_transform_point(&inv, &px, &py);
            px /= zoom;
            py /= zoom;

            auto points = this->vertexStroke->getPointVector();
            Point point = points[static_cast<size_t>(this->vertexIndex)];
            point.x = px;
            point.y = py;
            points[static_cast<size_t>(this->vertexIndex)] = point;
            this->vertexStroke->setPointVector(std::move(points));
            this->view->getXournal()->repaintSelection(true);
        }
        return;
    }

    if (this->mouseDownType == CURSOR_SELECTION_MOVE) {
'''
          assert mousemove_old in s
          s = s.replace(mousemove_old, mousemove_new, 1)

          # Hit-test geometry vertices before the regular bounding-box handles.
          hit_marker = '''    const int EDGE_PADDING = (this->btnWidth / 2) + 2;
    const int BORDER_PADDING = (this->btnWidth / 2);

'''
          hit_code = '''    const int EDGE_PADDING = (this->btnWidth / 2) + 2;
    const int BORDER_PADDING = (this->btnWidth / 2);

    this->vertexStroke = nullptr;
    this->vertexIndex = -1;
    if (isSingleGeometrySelection(this)) {
        auto* stroke = dynamic_cast<Stroke*>(this->getElementsView().front());
        if (stroke != nullptr) {
            const auto& points = stroke->getPointVector();
            const double hitRadius = std::max(7.0, static_cast<double>(this->btnWidth));
            for (size_t i = 0; i < points.size(); ++i) {
                const double vx = points[i].x * zoom;
                const double vy = points[i].y * zoom;
                if (std::hypot(x - vx, y - vy) <= hitRadius) {
                    this->vertexStroke = stroke;
                    this->vertexIndex = static_cast<int>(i);
                    return CURSOR_SELECTION_VERTEX;
                }
            }
        }
    }

'''
          assert hit_marker in s
          s = s.replace(hit_marker, hit_code, 1)

          p.write_text(s)

          # Avoid leaving a one-shot repair workflow in the branch after it has patched the tree.
          p = root / '.github/workflows/patch-vertex-edit.yml'
          p.unlink()

          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src/core/control/tools/CursorSelectionType.h',
                          'src/core/control/tools/EditSelection.h',
                          'src/core/control/tools/EditSelectionContents.h',
                          'src/core/control/tools/EditSelectionContents.cpp',
                          'src/core/control/tools/EditSelection.cpp'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Implement draggable geometry vertices'], check=True)
          subprocess.run(['git', 'push', 'origin', 'xournal-drawboard-ui'], check=True)
