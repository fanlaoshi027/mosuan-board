name: Repair ActionProperties
on:
  push:
    branches: [xournal-drawboard-ui]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[repair-actionproperties]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xournal-drawboard-ui
          fetch-depth: 0
      - name: Restore
        run: |
          git checkout f158434f9819f2f006eee6f133c95f6c765bb2a2 -- src/core/control/actions/ActionProperties.h
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/control/actions/ActionProperties.h')
          s=p.read_text()
          s=s.replace('#include "ActionDatabase.h"\n','#include "ActionDatabase.h"\n#include "FavoritePenActions.h"\n',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/actions/ActionProperties.h
          git commit -m '[repair-actionproperties] Restore ActionProperties'
          git push origin HEAD:xournal-drawboard-ui
