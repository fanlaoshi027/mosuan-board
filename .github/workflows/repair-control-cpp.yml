name: Repair Control.cpp

on:
  push:
    branches: [xournal-drawboard-ui]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.id == '56fd6d1e7bd69a34df8436c8ea7cc0ae025be91f'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and reapply favorite pen integration
        shell: bash
        run: |
          git checkout c51a300c91ed0dca7c4761fea9bd8ca1cc1264f0 -- src/core/control/Control.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/control/Control.cpp')
          s = p.read_text()
          include = '#include "control/FavoritePenManager.h"                          // for favorite pens\n'
          marker = '#include "control/RecentManager.h"                               // for Rece...\n'
          if include not in s:
              s = s.replace(marker, include + marker, 1)
          old = '    this->settings->load();\n    this->loadPaletteFromSettings();'
          new = '    this->settings->load();\n    FavoritePenManager::load(this->settings);\n    this->loadPaletteFromSettings();'
          if old not in s:
              raise SystemExit('Control.cpp insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-control-cpp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/Control.cpp .github/workflows/repair-control-cpp.yml
          git commit -m 'Repair Control.cpp and load favorite pens'
          git push
