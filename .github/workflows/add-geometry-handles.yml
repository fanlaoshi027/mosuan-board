name: Add geometry handles
on:
  push:
    branches: [xournal-drawboard-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Add single geometry vertex handles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch EditSelection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/control/tools/EditSelection.cpp')
          s = p.read_text()
          include_marker = '#include "model/Point.h"                          // for Point\n'
          include_line = '#include "model/Stroke.h"                         // for Stroke\n'
          if include_line not in s:
              s = s.replace(include_marker, include_marker + include_line, 1)

          helper = r'''

static bool isSingleGeometrySelection(const EditSelection* selection) {
    const auto elements = selection->getElementsView();
    if (elements.size() != 1) {
        return false;
    }
    const Element* element = elements.front();
    if (element->getType() != ELEMENT_STROKE) {
        return false;
    }
    const auto* stroke = dynamic_cast<const Stroke*>(element);
    return stroke != nullptr && stroke->getPointCount() >= 2 && stroke->getPointCount() <= 8;
}

'''
          marker = '/// Number of times to trigger edge pan timer per second\nconstexpr unsigned int PAN_TIMER_RATE = 30;\n'
          if 'static bool isSingleGeometrySelection' not in s:
              s = s.replace(marker, marker + helper, 1)

          old = '''    cairo_rectangle(cr, std::min(x, x + width) * zoom, std::min(y, y + height) * zoom, std::abs(width) * zoom,
                    std::abs(height) * zoom);

    // for debugging
'''
          new = '''    const bool singleGeometry = isSingleGeometrySelection(this);
    if (!singleGeometry) {
        cairo_rectangle(cr, std::min(x, x + width) * zoom, std::min(y, y + height) * zoom, std::abs(width) * zoom,
                        std::abs(height) * zoom);
    }

    // for debugging
'''
          if old not in s:
              raise SystemExit('selection rectangle insertion point not found')
          s = s.replace(old, new, 1)

          old2 = '''    cairo_stroke_preserve(cr);
    auto applied = GdkRGBA{selectionColor.red, selectionColor.green, selectionColor.blue, 0.3};
    gdk_cairo_set_source_rgba(cr, &applied);
    cairo_fill(cr);

    ToolHandler* toolHandler = view->getXournal()->getControl()->getToolHandler();
'''
          new2 = '''    if (!singleGeometry) {
        cairo_stroke_preserve(cr);
        auto applied = GdkRGBA{selectionColor.red, selectionColor.green, selectionColor.blue, 0.3};
        gdk_cairo_set_source_rgba(cr, &applied);
        cairo_fill(cr);
    }

    ToolHandler* toolHandler = view->getXournal()->getControl()->getToolHandler();
'''
          if old2 not in s:
              raise SystemExit('selection fill insertion point not found')
          s = s.replace(old2, new2, 1)

          marker2 = '''    if (toolHandler->getToolType() != TOOL_HAND) {
        cairo_set_dash(cr, nullptr, 0, 0);
'''
          insert2 = '''    if (toolHandler->getToolType() != TOOL_HAND) {
        cairo_set_dash(cr, nullptr, 0, 0);
        if (singleGeometry) {
            const auto* stroke = dynamic_cast<const Stroke*>(getElementsView().front());
            const auto& points = stroke->getPointVector();
            const double cx = (snappedBounds.x + snappedBounds.width / 2) * zoom;
            const double cy = (snappedBounds.y + snappedBounds.height / 2) * zoom;
            cairo_save(cr);
            cairo_translate(cr, cx, cy);
            cairo_rotate(cr, this->rotation);
            cairo_translate(cr, -cx, -cy);
            for (const auto& point: points) {
                const double px = point.x * zoom;
                const double py = point.y * zoom;
                gdk_cairo_set_source_rgba(cr, &selectionColor);
                cairo_arc(cr, px, py, std::max(4.0, this->btnWidth * 0.55), 0, 2 * M_PI);
                cairo_fill_preserve(cr);
                cairo_set_source_rgb(cr, 1, 1, 1);
                cairo_set_line_width(cr, 1.5);
                cairo_stroke(cr);
            }
            cairo_restore(cr);
        }
'''
          if marker2 not in s:
              raise SystemExit('toolbox paint insertion point not found')
          s = s.replace(marker2, insert2, 1)

          p.write_text(s)
          PY
          rm -f .github/workflows/add-geometry-handles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/tools/EditSelection.cpp .github/workflows/add-geometry-handles.yml
          git commit -m 'Add single geometry vertex handles'
          git push