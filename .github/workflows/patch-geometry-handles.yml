name: Patch geometry handles
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/control/tools/EditSelection.cpp')
          s = p.read_text()
          s = s.replace('#include "model/Point.h"                          // for Point\n', '#include "model/Point.h"                          // for Point\n#include "model/Stroke.h"                         // for Stroke\n', 1)
          marker = 'constexpr unsigned int PAN_TIMER_RATE = 30;\n'
          helper = '''\nstatic bool isSingleGeometrySelection(const EditSelection* selection) {\n    const auto elements = selection->getElementsView();\n    if (elements.size() != 1) return false;\n    const Element* element = elements.front();\n    if (element->getType() != ELEMENT_STROKE) return false;\n    const auto* stroke = dynamic_cast<const Stroke*>(element);\n    return stroke != nullptr && stroke->getPointCount() >= 2 && stroke->getPointCount() <= 8;\n}\n\n'''
          if 'static bool isSingleGeometrySelection' not in s:
              s = s.replace(marker, marker + helper, 1)
          old = '''    cairo_rectangle(cr, std::min(x, x + width) * zoom, std::min(y, y + height) * zoom, std::abs(width) * zoom,\n                    std::abs(height) * zoom);\n\n    // for debugging\n'''
          new = '''    const bool singleGeometry = isSingleGeometrySelection(this);\n    if (!singleGeometry) {\n        cairo_rectangle(cr, std::min(x, x + width) * zoom, std::min(y, y + height) * zoom, std::abs(width) * zoom,\n                        std::abs(height) * zoom);\n    }\n\n    // for debugging\n'''
          if old not in s: raise SystemExit('rectangle marker missing')
          s = s.replace(old, new, 1)
          old = '''    cairo_stroke_preserve(cr);\n    auto applied = GdkRGBA{selectionColor.red, selectionColor.green, selectionColor.blue, 0.3};\n    gdk_cairo_set_source_rgba(cr, &applied);\n    cairo_fill(cr);\n\n    ToolHandler* toolHandler = view->getXournal()->getControl()->getToolHandler();\n'''
          new = '''    if (!singleGeometry) {\n        cairo_stroke_preserve(cr);\n        auto applied = GdkRGBA{selectionColor.red, selectionColor.green, selectionColor.blue, 0.3};\n        gdk_cairo_set_source_rgba(cr, &applied);\n        cairo_fill(cr);\n    }\n\n    ToolHandler* toolHandler = view->getXournal()->getControl()->getToolHandler();\n'''
          if old not in s: raise SystemExit('fill marker missing')
          s = s.replace(old, new, 1)
          marker = '''    if (toolHandler->getToolType() != TOOL_HAND) {\n        cairo_set_dash(cr, nullptr, 0, 0);\n'''
          insert = '''    if (toolHandler->getToolType() != TOOL_HAND) {\n        cairo_set_dash(cr, nullptr, 0, 0);\n        if (singleGeometry) {\n            const auto* stroke = dynamic_cast<const Stroke*>(getElementsView().front());\n            const auto& points = stroke->getPointVector();\n            const double cx = (snappedBounds.x + snappedBounds.width / 2) * zoom;\n            const double cy = (snappedBounds.y + snappedBounds.height / 2) * zoom;\n            cairo_save(cr);\n            cairo_translate(cr, cx, cy);\n            cairo_rotate(cr, this->rotation);\n            cairo_translate(cr, -cx, -cy);\n            for (const auto& point: points) {\n                gdk_cairo_set_source_rgba(cr, &selectionColor);\n                cairo_arc(cr, point.x * zoom, point.y * zoom, std::max(4.0, this->btnWidth * 0.55), 0, 2 * M_PI);\n                cairo_fill_preserve(cr);\n                cairo_set_source_rgb(cr, 1, 1, 1);\n                cairo_set_line_width(cr, 1.5);\n                cairo_stroke(cr);\n            }\n            cairo_restore(cr);\n        }\n'''
          if marker not in s: raise SystemExit('tool marker missing')
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/patch-geometry-handles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/tools/EditSelection.cpp .github/workflows/patch-geometry-handles.yml
          git commit -m 'Add single geometry vertex handles'
          git push