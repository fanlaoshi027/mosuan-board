name: Verify 墨写 build

on:
  push:
    branches: [xournal-drawboard-ui]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Verify 墨写 build and remove workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-dev gcc g++ cmake ninja-build libgtk-3-dev libpoppler-glib-dev portaudio19-dev libsndfile1-dev liblua5.3-dev libzip-dev gettext help2man libgtest-dev libgtksourceview-4-dev libqpdf-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Remove verification workflow
        if: success()
        run: |
          rm .github/workflows/verify-mosuan-build.yml
          git config user.name "fanlaoshi027"
          git config user.email "fanzeping@gmail.com"
          git add .github/workflows/verify-mosuan-build.yml
          git commit -m "Verify 墨写 build and remove workflow"
          git push origin xournal-drawboard-ui
