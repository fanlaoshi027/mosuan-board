name: Fix 墨写 build errors

on:
  push:
    branches: [xournal-drawboard-ui]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix 墨写 build errors and remove workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, count))

          replace('src/core/control/tools/EditSelection.cpp',
              '''InsertionOrder EditSelection::makeMoveEffective() -> InsertionOrder {
              return contents->makeMoveEffective(this->getRect(), this->snappedBounds, this->preserveAspectRatio);
          }''',
              '''InsertionOrder EditSelection::makeMoveEffective() -> InsertionOrder {
              return contents->makeMoveEffective(this->getRect(), this->snappedBounds, this->preserveAspectRatio,
                                                this->rotationCenterX, this->rotationCenterY);
          }''')

          replace('src/core/control/tools/EditSelection.cpp',
              '''void EditSelection::mouseUp() {
              if (this->mouseDownType == CURSOR_SELECTION_ROTATION_CENTER) {
                  Point center = snapRotationCenter(mouseX / zoom, mouseY / zoom);
                  this->rotationCenterX = center.x;
                  this->rotationCenterY = center.y;
                  updateMatrix();
                  this->view->getXournal()->repaintSelection(true);
                  return;
              }''',
              '''void EditSelection::mouseUp() {
              if (this->mouseDownType == CURSOR_SELECTION_ROTATION_CENTER) {
                  this->mouseDownType = CURSOR_SELECTION_NONE;
                  updateMatrix();
                  this->view->getXournal()->repaintSelection(true);
                  return;
              }''')

          replace('src/core/control/tools/EditSelection.cpp',
              '''        auto* stroke = dynamic_cast<Stroke*>(this->getElementsView().front());''',
              '''        auto* stroke = const_cast<Stroke*>(dynamic_cast<const Stroke*>(this->getElementsView().front()));''')

          replace('src/core/control/tools/EditSelection.cpp',
              '''    const double pivotRelX = this->rotationCenterX - oldX;
              const double pivotRelY = this->rotationCenterY - oldY;
              double dx''',
              '''    double dx''')

          replace('src/core/control/tools/EditSelectionContents.cpp',
              '''#include "control/Control.h"                      // for Control''',
              '''#include "control/Control.h"                      // for Control
          #include "model/Document.h"                    // for Document''')

          replace('src/core/control/tools/EditSelectionContents.cpp',
              '''#include "util/Assert.h"                          // for xoj_assert''',
              '''#include "util/Assert.h"                          // for xoj_assert
          #include "util/i18n.h"                          // for _''')

          replace('src/core/control/tools/EditSelectionContents.cpp',
              '''        this->page->fireRectChanged(Rectangle<double>(stroke->boundingRect()));''',
              '''        auto rect = Rectangle<double>(stroke->boundingRect());
                  this->page->fireRectChanged(rect);''')
          PY
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-dev gcc g++ cmake ninja-build libgtk-3-dev libpoppler-glib-dev portaudio19-dev libsndfile1-dev liblua5.3-dev libzip-dev gettext help2man libgtest-dev libgtksourceview-4-dev libqpdf-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Commit fixes and remove workflow
        if: success()
        run: |
          rm .github/workflows/fix-mosuan-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/tools/EditSelection.cpp src/core/control/tools/EditSelectionContents.cpp .github/workflows/fix-mosuan-build.yml
          git commit -m 'Fix 墨写 build errors and remove workflow'
          git push origin xournal-drawboard-ui
