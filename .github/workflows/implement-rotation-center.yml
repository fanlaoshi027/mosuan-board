name: Implement 墨写 custom rotation center

on:
  push:
    branches: [xournal-drawboard-ui]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Implement 墨写 custom rotation center and clean repair workflows') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rotation center
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, count))

          # 1. Cursor state
          replace('src/core/control/tools/CursorSelectionType.h',
              '    CURSOR_SELECTION_ROTATE,\n    CURSOR_SELECTION_DELETE',
              '    CURSOR_SELECTION_ROTATE,\n    // 墨写: draggable rotation-center handle\n    CURSOR_SELECTION_ROTATION_CENTER,\n    CURSOR_SELECTION_DELETE')

          # 2. EditSelection API/state
          replace('src/core/control/tools/EditSelection.h',
              '    void updateMatrix();\n    void scaleShift(double fx, double fy, bool changeLeft, bool changeTop);',
              '    void updateMatrix();\n    void scaleShift(double fx, double fy, bool changeLeft, bool changeTop);\n    Point getRotationCenter() const;\n    Point snapRotationCenter(double x, double y) const;\n    void drawRotationCenter(cairo_t* cr, double zoom);')
          replace('src/core/control/tools/EditSelection.h',
              '    double relMousePosRotY{};\n\n    // 墨写: active vertex while editing a single geometry.',
              '    double relMousePosRotY{};\n\n    // 墨写: temporary custom rotation pivot. It resets when a selection is recreated.\n    double rotationCenterX{};\n    double rotationCenterY{};\n    bool customRotationCenter = false;\n\n    // 墨写: active vertex while editing a single geometry.')

          # 3. EditSelectionContents API: rotation pivot is now explicit.
          replace('src/core/control/tools/EditSelectionContents.h',
              '    InsertionOrder makeMoveEffective(const xoj::util::Rectangle<double>& bounds,\n                                     const xoj::util::Rectangle<double>& snappedBounds, bool preserveAspectRatio);',
              '    InsertionOrder makeMoveEffective(const xoj::util::Rectangle<double>& bounds,\n                                     const xoj::util::Rectangle<double>& snappedBounds, bool preserveAspectRatio,\n                                     double rotationCenterX, double rotationCenterY);')
          replace('src/core/control/tools/EditSelectionContents.h',
              '                       CursorSelectionType type);',
              '                       CursorSelectionType type, double rotationCenterX, double rotationCenterY);')

          # 4. Actual transformation + undo pivot.
          replace('src/core/control/tools/EditSelectionContents.cpp',
              '                                                        bool preserveAspectRatio) {',
              '                                                        bool preserveAspectRatio, double rotationCenterX,\n                                                        double rotationCenterY) {', 1)
          replace('src/core/control/tools/EditSelectionContents.cpp',
              '            e->rotate(snappedBounds.x + this->lastSnappedBounds.width / 2,\n                      snappedBounds.y + this->lastSnappedBounds.height / 2, this->rotation);',
              '            e->rotate(rotationCenterX, rotationCenterY, this->rotation);')
          replace('src/core/control/tools/EditSelectionContents.cpp',
              'void EditSelectionContents::updateContent(Rectangle<double> bounds, Rectangle<double> snappedBounds, double rotation,\n                                          bool aspectRatio, Layer* layer, const PageRef& targetPage,\n                                          UndoRedoHandler* undo, CursorSelectionType type) {',
              'void EditSelectionContents::updateContent(Rectangle<double> bounds, Rectangle<double> snappedBounds, double rotation,\n                                          bool aspectRatio, Layer* layer, const PageRef& targetPage,\n                                          UndoRedoHandler* undo, CursorSelectionType type,\n                                          double rotationCenterX, double rotationCenterY) {')
          replace('src/core/control/tools/EditSelectionContents.cpp',
              '                this->sourcePage, &this->selected, snappedBounds.x + snappedBounds.width / 2,\n                snappedBounds.y + snappedBounds.height / 2, rotation - this->lastRotation));',
              '                this->sourcePage, &this->selected, rotationCenterX, rotationCenterY,\n                rotation - this->lastRotation));')

          # 5. Initialize custom pivot at selection center.
          replace('src/core/control/tools/EditSelection.cpp',
              '    this->contents->replaceInsertionOrder(std::move(elts));\n\n    cairo_matrix_init_identity(&this->cmatrix);',
              '    this->contents->replaceInsertionOrder(std::move(elts));\n\n    this->rotationCenterX = this->snappedBounds.x + this->snappedBounds.width / 2;\n    this->rotationCenterY = this->snappedBounds.y + this->snappedBounds.height / 2;\n    this->customRotationCenter = false;\n\n    cairo_matrix_init_identity(&this->cmatrix);')

          # 6. All update/make calls pass the pivot.
          replace('src/core/control/tools/EditSelection.cpp',
              'this->contents->updateContent(this->getRect(), this->snappedBounds, this->rotation, this->preserveAspectRatio,\n                                      layer, page, this->undo, CURSOR_SELECTION_MOVE);',
              'this->contents->updateContent(this->getRect(), this->snappedBounds, this->rotation, this->preserveAspectRatio,\n                                      layer, page, this->undo, CURSOR_SELECTION_MOVE,\n                                      this->rotationCenterX, this->rotationCenterY);')
          replace('src/core/control/tools/EditSelection.cpp',
              'this->contents->makeMoveEffective(this->getRect(), this->snappedBounds, this->preserveAspectRatio);',
              'this->contents->makeMoveEffective(this->getRect(), this->snappedBounds, this->preserveAspectRatio,\n                                              this->rotationCenterX, this->rotationCenterY);')
          replace('src/core/control/tools/EditSelection.cpp',
              'this->contents->updateContent(this->getRect(), this->snappedBounds, this->rotation, this->preserveAspectRatio,\n                                  layer, page, this->undo, this->mouseDownType);',
              'this->contents->updateContent(this->getRect(), this->snappedBounds, this->rotation, this->preserveAspectRatio,\n                                  layer, page, this->undo, this->mouseDownType,\n                                  this->rotationCenterX, this->rotationCenterY);')
          replace('src/core/control/tools/EditSelection.cpp',
              'this->contents->updateContent(this->getRect(), this->snappedBounds, this->rotation, this->preserveAspectRatio,\n                                      this->view->getPage()->getSelectedLayer(), this->view->getPage(), this->undo,\n                                      CURSOR_SELECTION_MOVE);',
              'this->contents->updateContent(this->getRect(), this->snappedBounds, this->rotation, this->preserveAspectRatio,\n                                      this->view->getPage()->getSelectedLayer(), this->view->getPage(), this->undo,\n                                      CURSOR_SELECTION_MOVE, this->rotationCenterX, this->rotationCenterY);')

          # 7. Mouse hit test: center handle first, then normal selection controls.
          replace('src/core/control/tools/EditSelection.cpp',
              '    cairo_matrix_transform_point(&this->cmatrix, &x, &y);\n\n\n    const int EDGE_PADDING',
              '    const double centerHitRadius = std::max(8.0, static_cast<double>(this->btnWidth));\n    const double centerX = this->rotationCenterX * zoom;\n    const double centerY = this->rotationCenterY * zoom;\n    if (supportRotation && std::hypot(x - centerX, y - centerY) <= centerHitRadius) {\n        return CURSOR_SELECTION_ROTATION_CENTER;\n    }\n\n    cairo_matrix_transform_point(&this->cmatrix, &x, &y);\n\n\n    const int EDGE_PADDING')

          # 8. Mouse down: center handle starts a temporary pivot drag.
          replace('src/core/control/tools/EditSelection.cpp',
              '    this->mouseDownType = type;\n\n    if (type == CURSOR_SELECTION_VERTEX)',
              '    this->mouseDownType = type;\n\n    if (type == CURSOR_SELECTION_ROTATION_CENTER) {\n        this->customRotationCenter = true;\n        return;\n    }\n\n    if (type == CURSOR_SELECTION_VERTEX)')

          # 9. Mouse move: drag and snap pivot to nearby vertices/segments.
          replace('src/core/control/tools/EditSelection.cpp',
              '    if (this->mouseDownType == CURSOR_SELECTION_VERTEX) {',
              '    if (this->mouseDownType == CURSOR_SELECTION_ROTATION_CENTER) {\n        Point center = snapRotationCenter(mouseX / zoom, mouseY / zoom);\n        this->rotationCenterX = center.x;\n        this->rotationCenterY = center.y;\n        updateMatrix();\n        this->view->getXournal()->repaintSelection(true);\n        return;\n    }\n\n    if (this->mouseDownType == CURSOR_SELECTION_VERTEX) {', 1)

          # 10. Move pivot with selection translation.
          replace('src/core/control/tools/EditSelection.cpp',
              '    this->x += dx;\n    this->y += dy;\n    this->snappedBounds.x += dx;\n    this->snappedBounds.y += dy;\n\n    updateMatrix();',
              '    this->x += dx;\n    this->y += dy;\n    this->snappedBounds.x += dx;\n    this->snappedBounds.y += dy;\n    this->rotationCenterX += dx;\n    this->rotationCenterY += dy;\n\n    updateMatrix();')

          # 11. Use custom pivot for rotation preview.
          replace('src/core/control/tools/EditSelection.cpp',
              '        double rdx = mouseX / zoom - this->snappedBounds.x - this->snappedBounds.width / 2;\n        double rdy = mouseY / zoom - this->snappedBounds.y - this->snappedBounds.height / 2;',
              '        double rdx = mouseX / zoom - this->rotationCenterX;\n        double rdy = mouseY / zoom - this->rotationCenterY;')
          replace('src/core/control/tools/EditSelection.cpp',
              '    double rx = (this->snappedBounds.x + this->snappedBounds.width / 2) * zoom;\n    double ry = (this->snappedBounds.y + this->snappedBounds.height / 2) * zoom;',
              '    double rx = this->rotationCenterX * zoom;\n    double ry = this->rotationCenterY * zoom;')

          # 12. Keep pivot attached during resize.
          replace('src/core/control/tools/EditSelection.cpp',
              'void EditSelection::scaleShift(double fx, double fy, bool changeLeft, bool changeTop) {\n    double dx',
              'void EditSelection::scaleShift(double fx, double fy, bool changeLeft, bool changeTop) {\n    const double oldX = this->snappedBounds.x;\n    const double oldY = this->snappedBounds.y;\n    const double oldW = this->snappedBounds.width;\n    const double oldH = this->snappedBounds.height;\n    const double pivotRelX = this->rotationCenterX - oldX;\n    const double pivotRelY = this->rotationCenterY - oldY;\n    double dx')
          replace('src/core/control/tools/EditSelection.cpp',
              '    this->snappedBounds.x += dx;\n    this->snappedBounds.y += dy;\n\n    // compute new rotation center',
              '    this->snappedBounds.x += dx;\n    this->snappedBounds.y += dy;\n\n    if (this->customRotationCenter) {\n        const double anchorX = changeLeft ? oldX + oldW : oldX;\n        const double anchorY = changeTop ? oldY + oldH : oldY;\n        this->rotationCenterX = anchorX + (this->rotationCenterX - anchorX) * fx;\n        this->rotationCenterY = anchorY + (this->rotationCenterY - anchorY) * fy;\n    } else {\n        this->rotationCenterX = this->snappedBounds.x + this->snappedBounds.width / 2;\n        this->rotationCenterY = this->snappedBounds.y + this->snappedBounds.height / 2;\n    }\n\n    // compute new rotation center')

          # 13. Draw custom pivot handle and helper.
          marker = 'void EditSelection::drawAnchorRotation(cairo_t* cr, double x, double y, double zoom) {'
          helper = '''Point EditSelection::getRotationCenter() const {\n    return Point(this->rotationCenterX, this->rotationCenterY);\n}\n\nPoint EditSelection::snapRotationCenter(double px, double py) const {\n    const double threshold = 14.0 / this->view->getXournal()->getZoom();\n    Point best(px, py);\n    double bestDist = threshold;\n\n    for (const Element* element: this->getElementsView()) {\n        if (element->getType() != ELEMENT_STROKE) continue;\n        const auto* stroke = dynamic_cast<const Stroke*>(element);\n        if (stroke == nullptr) continue;\n        const auto& points = stroke->getPointVector();\n        for (const Point& p: points) {\n            const double d = std::hypot(p.x - px, p.y - py);\n            if (d < bestDist) { bestDist = d; best = p; }\n        }\n        for (size_t i = 1; i < points.size(); ++i) {\n            const Point& a = points[i - 1];\n            const Point& b = points[i];\n            const double vx = b.x - a.x;\n            const double vy = b.y - a.y;\n            const double len2 = vx * vx + vy * vy;\n            const double t = len2 > 0 ? std::clamp(((px - a.x) * vx + (py - a.y) * vy) / len2, 0.0, 1.0) : 0.0;\n            const double qx = a.x + t * vx;\n            const double qy = a.y + t * vy;\n            const double d = std::hypot(qx - px, qy - py);\n            if (d < bestDist) { bestDist = d; best = Point(qx, qy); }\n        }\n    }\n    return best;\n}\n\nvoid EditSelection::drawRotationCenter(cairo_t* cr, double zoom) {\n    cairo_save(cr);\n    cairo_set_line_width(cr, 1.5);\n    cairo_set_source_rgb(cr, 1, 0.65, 0);\n    const double cx = this->rotationCenterX * zoom;\n    const double cy = this->rotationCenterY * zoom;\n    cairo_arc(cr, cx, cy, std::max(5.0, this->btnWidth * 0.65), 0, 2 * M_PI);\n    cairo_stroke_preserve(cr);\n    cairo_move_to(cr, cx - 4, cy); cairo_line_to(cr, cx + 4, cy);\n    cairo_move_to(cr, cx, cy - 4); cairo_line_to(cr, cx, cy + 4);\n    cairo_stroke(cr);\n    cairo_restore(cr);\n}\n\n'''
          replace('src/core/control/tools/EditSelection.cpp', marker, helper + marker)

          # Paint pivot after selection handles.
          replace('src/core/control/tools/EditSelection.cpp',
              '        drawDeleteRect(cr, std::min(x, x + width) - (DELETE_PADDING + this->btnWidth) / zoom, y, zoom);\n    }\n}',
              '        drawDeleteRect(cr, std::min(x, x + width) - (DELETE_PADDING + this->btnWidth) / zoom, y, zoom);\n        if (supportRotation) {\n            drawRotationCenter(cr, zoom);\n        }\n    }\n}')

          # 14. Remove temporary repair workflows after this commit.
          for p in [Path('.github/workflows/fix-vertex-undo.yml'), Path('.github/workflows/test-macos-build.yml')]:
              if p.exists(): p.unlink()
          Path('.github/workflows/implement-rotation-center.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "fanlaoshi027"
          git config user.email "fanzeping@gmail.com"
          git add src/core/control/tools/CursorSelectionType.h src/core/control/tools/EditSelection.h src/core/control/tools/EditSelection.cpp src/core/control/tools/EditSelectionContents.h src/core/control/tools/EditSelectionContents.cpp .github/workflows
          git commit -m "Implement 墨写 custom rotation center and clean repair workflows"
          git push origin xournal-drawboard-ui
