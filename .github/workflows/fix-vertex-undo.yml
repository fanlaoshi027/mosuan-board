name: Fix vertex undo implementation

on:
  push:
    branches: [xournal-drawboard-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement vertex undo and remove repair workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch vertex undo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/control/tools/EditSelectionContents.cpp')
          s = p.read_text()
          marker = '''/**\n * Sets the font of all containing text elements, return an undo action\n'''
          method = '''/**\n * Creates an undo action for a single geometry vertex edit.\n */\nauto EditSelectionContents::createVertexEditUndo(Stroke* stroke, std::vector<Point> oldPoints) -> UndoActionPtr {\n    if (stroke == nullptr || oldPoints.empty()) {\n        return nullptr;\n    }\n\n    const auto newPoints = stroke->getPointVector();\n    if (newPoints == oldPoints) {\n        return nullptr;\n    }\n\n    this->deleteViewBuffer();\n    this->sourceView->getXournal()->repaintSelection(true);\n    return std::make_unique<VertexEditUndoAction>(this->sourcePage, stroke, std::move(oldPoints), newPoints);\n}\n\n'''
          if 'EditSelectionContents::createVertexEditUndo' not in s:
              if marker not in s:
                  raise SystemExit('font marker not found')
              s = s.replace(marker, method + marker, 1)
              p.write_text(s)
          PY
      - name: Build source
        uses: ./.github/actions/install_deps_ubuntu
        with:
          install_path: $HOME
      - name: Configure and compile
        uses: ./.github/actions/build
        with:
          build_type: Release
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-vertex-undo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/tools/EditSelectionContents.cpp .github/workflows/fix-vertex-undo.yml
          git commit -m 'Implement vertex undo and remove repair workflow'
          git push
