name: Apply live pause-to-line
on:
  push:
    branches: [xournal-drawboard-ui]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply live pause-to-line') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch StrokeHandler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/control/tools/StrokeHandler.cpp')
          s = p.read_text()
          old = '''    lastMotionTimestamp = pos.timestamp;\n    stabilizer->processEvent(pos);\n    return true;\n}'''
          new = '''    // If the pen has remained down and nearly still for a moment, switch to a\n    // live straight-line adjustment mode. The next motion changes only the\n    // endpoint; lifting the pen commits the current two-point line.\n    const guint32 pauseDuration = pos.timestamp - lastMotionTimestamp;\n    if (!pausedLineMode && pauseDuration >= PAUSE_TO_LINE_MS) {\n        pausedLineMode = convertPausedStrokeToLine();\n    }\n\n    if (pausedLineMode) {\n        updatePausedLine(Point(pos.x / zoom, pos.y / zoom,\n                               hasPressure ? pos.pressure * stroke->getWidth() : Point::NO_PRESSURE));\n        lastMotionTimestamp = pos.timestamp;\n        return true;\n    }\n\n    lastMotionTimestamp = pos.timestamp;\n    stabilizer->processEvent(pos);\n    return true;\n}'''
          if old not in s:
              raise SystemExit('motion insertion point not found')
          s = s.replace(old, new, 1)
          marker = '''    stroke->setPointVector(std::move(linePoints));\n    return true;\n}\n\nvoid StrokeHandler::finalizeStroke'''
          replacement = '''    stroke->setPointVector(std::move(linePoints));\n    return true;\n}\n\nvoid StrokeHandler::updatePausedLine(Point point) {\n    if (!stroke || stroke->getPointCount() < 2) {\n        return;\n    }\n\n    const auto& points = stroke->getPointVector();\n    const Point start = points.front();\n    std::vector<Point> linePoints;\n    linePoints.reserve(2);\n    if (hasPressure) {\n        linePoints.emplace_back(start.x, start.y, start.z);\n        linePoints.emplace_back(point.x, point.y, point.z);\n    } else {\n        linePoints.emplace_back(start.x, start.y);\n        linePoints.emplace_back(point.x, point.y);\n    }\n    stroke->setPointVector(std::move(linePoints));\n    viewPool->dispatch(xoj::view::StrokeToolView::STROKE_REPLACEMENT_REQUEST, *stroke);\n}\n\nvoid StrokeHandler::finalizeStroke'''
          if marker not in s:
              raise SystemExit('update method insertion point not found')
          s = s.replace(marker, replacement, 1)
          old_release = '''    const guint32 pauseDuration = pos.timestamp - lastMotionTimestamp;\n    const bool pausedLongEnough = pauseDuration >= PAUSE_TO_LINE_MS;\n    if (pausedLongEnough) {\n        convertPausedStrokeToLine();\n    }\n\n    Layer* layer = page->getSelectedLayer();'''
          new_release = '''    // pausedLineMode already keeps the final endpoint live while the pen is down.\n    // For a release without a live adjustment, retain the existing fallback conversion.\n    if (!pausedLineMode) {\n        const guint32 pauseDuration = pos.timestamp - lastMotionTimestamp;\n        if (pauseDuration >= PAUSE_TO_LINE_MS) {\n            convertPausedStrokeToLine();\n        }\n    }\n    pausedLineMode = false;\n\n    Layer* layer = page->getSelectedLayer();'''
          if old_release not in s:
              raise SystemExit('release insertion point not found')
          s = s.replace(old_release, new_release, 1)
          old_press = '''    stroke = createStroke(this->control);\n    lastMotionTimestamp = pos.timestamp;'''
          new_press = '''    stroke = createStroke(this->control);\n    pausedLineMode = false;\n    lastMotionTimestamp = pos.timestamp;'''
          if old_press not in s:
              raise SystemExit('press insertion point not found')
          s = s.replace(old_press, new_press, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-live-line.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/control/tools/StrokeHandler.cpp .github/workflows/apply-live-line.yml
          git commit -m 'Apply live pause-to-line behavior'
          git push
